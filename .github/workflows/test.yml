name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep the files byte for byte: no CRLF conversion on Windows.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # Includes the interop tests against the runner's git.
      - run: go test ./...

      # The trust tests give files to another user, which needs root.
      - if: runner.os != 'Windows'
        run: sudo -E env "PATH=$PATH" go test -count=1 -run Trust ./...
